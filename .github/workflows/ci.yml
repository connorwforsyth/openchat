name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      # bun installs and runs scripts; Next itself runs on Node, as it does in the containers.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install
        run: bun install --frozen-lockfile

      # Per-package `lint` tasks don't cover root config files, so check the whole tree once.
      - name: Lint repo root
        run: bun run check

      # Tokens, icon imports, brand string and Lingui catalogs (scripts/ci). `lint`
      # depends on these too; this step just fails fast with a readable log.
      - name: Repo guards
        run: bun run check:guards

      - name: Typecheck, lint, test, build
        run: bun turbo typecheck lint test build
