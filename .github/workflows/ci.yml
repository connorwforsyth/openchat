name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      # bun installs and runs scripts; Next itself runs on Node, as it does in the containers.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install
        # Retried once: native builds (better-sqlite3 via evalite) occasionally race in bunx node-gyp.
        run: bun install --frozen-lockfile || bun install --frozen-lockfile

      # Per-package `lint` tasks don't cover root config files, so check the whole tree once.
      - name: Lint repo root
        run: bun run check

      # Tokens, icon imports, brand string and Lingui catalogs (scripts/ci). `lint`
      # depends on these too; this step just fails fast with a readable log.
      - name: Repo guards
        run: bun run check:guards

      # Component tests run in Vitest browser mode on headless Chromium.
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium-headless-shell

      - name: Typecheck, lint, test, build
        run: bun turbo typecheck lint test build

      # Evalite suites on recorded fixtures (D21): no network, no keys. Any
      # score under 100% fails the step.
      - name: Dev evals
        run: bun turbo eval

  # PGlite (what `ci` tests on) is Postgres 18; production and compose run 17.
  # This job applies the migrations to a real Postgres 17 with pgvector and
  # runs the db tests there, each in a database of its own.
  db:
    name: db (postgres 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI-only throwaway credentials for the service container above.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install
        # Retried once: native builds (better-sqlite3 via evalite) occasionally race in bunx node-gyp.
        run: bun install --frozen-lockfile || bun install --frozen-lockfile

      - name: Migrations are up to date with the schema
        working-directory: packages/db
        run: |
          bunx drizzle-kit generate --output json | tee /tmp/generate.json
          grep -q '"status":"no_changes"' /tmp/generate.json

      - name: Migrate
        run: bun turbo db:migrate --filter=@workspace/db

      - name: Migrate again (idempotent)
        run: bun turbo db:migrate --filter=@workspace/db

      - name: Test against Postgres 17
        working-directory: packages/db
        run: bunx vitest run

  # The Docker sandbox path end to end (ticket 029, PLAN.md §11 step 6):
  # builds the runner image, starts the `sandbox` compose profile (runner +
  # socket proxy) on the runner's real Docker, and drives it through the
  # docker provider's client. Once per OCI runtime, since both must keep
  # working (docs/decisions/0005): runc gets the admin warning, runsc is gVisor.
  # Docker sandboxes are slow and minute-hungry: run them only on pushes to
  # main that touch the sandbox (the loop runs them locally before merging
  # when Docker is available). Private-repo Actions minutes are limited.
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      sandbox: ${{ steps.filter.outputs.sandbox }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: filter
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(apps/sandbox-runner/|packages/sandbox/|docker-compose.yml)'; then
            echo "sandbox=true" >> "$GITHUB_OUTPUT"
          else
            echo "sandbox=false" >> "$GITHUB_OUTPUT"
          fi

  sandbox:
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    name: sandbox (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runtime: [runc, runsc]
    env:
      EXPECT_RUNTIME: ${{ matrix.runtime }}
      # `auto` on both legs, so the runtime detection is what's under test.
      SANDBOX_RUNTIME: auto
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # https://gvisor.dev/docs/user_guide/install/ (apt repository), then
      # `runsc install` adds it to /etc/docker/daemon.json.
      - name: Install gVisor
        if: matrix.runtime == 'runsc'
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q runsc
          sudo runsc install
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}'

      # A fresh secret per run, masked in the log; never stored anywhere.
      - name: Generate the runner token
        run: |
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          echo "SANDBOX_RUNNER_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Start the sandbox profile
        # Retried: Docker Hub blob pulls occasionally fail mid-download on hosted runners.
        run: |
          for attempt in 1 2 3; do
            docker compose --profile sandbox up -d --build --wait --wait-timeout 180 docker-socket-proxy sandbox-runner && exit 0
            echo "compose up failed (attempt $attempt), retrying"; sleep 10
          done
          exit 1

      - name: Install
        # Retried once: native builds (better-sqlite3 via evalite) occasionally race in bunx node-gyp.
        run: bun install --frozen-lockfile --filter sandbox-runner || bun install --frozen-lockfile --filter sandbox-runner

      - name: Smoke test
        working-directory: apps/sandbox-runner
        run: bun run smoke

      - name: Runner and proxy logs
        if: failure()
        run: |
          docker compose --profile sandbox ps -a
          docker compose --profile sandbox logs --no-color docker-socket-proxy sandbox-runner
          docker ps -a --filter label=sandbox-runner.managed
