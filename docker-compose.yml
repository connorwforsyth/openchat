# Local services for development. Every value has a safe dev default, so
# `docker compose up -d` works without a .env; set overrides in .env.
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      # Bound to localhost so the dev database is never exposed on the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional self-hosted web search: `docker compose --profile search up -d`,
  # then set SEARXNG_URL. Pinned to a release (bump deliberately); the
  # settings below turn on the JSON API the `web_search` tool calls.
  searxng:
    image: searxng/searxng:2026.9.25-12f8b6515
    profiles: [search]
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://localhost:${SEARXNG_PORT:-8080}/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-dev-only-change-me}
    configs:
      - source: searxng-settings
        target: /etc/searxng/settings.yml
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8080}:8080"

configs:
  searxng-settings:
    content: |
      use_default_settings: true
      search:
        formats: [html, json]

volumes:
  postgres-data:
