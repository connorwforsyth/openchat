# The whole app (PLAN.md D6): `cp .env.example .env && docker compose up -d`
# serves it on http://localhost:3000 with Postgres (docs/self-hosting.md).
# Every value has a safe default, so it also works without a .env. For
# development, `docker compose up -d postgres` gives `bun dev` its database.
# Optional profiles: search (SearXNG), sandbox (Docker sandboxes), artifacts,
# voice (Whisper and Kokoro, docs/voice.md).
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      secrets: [ca, npmrc]
      # Icons and fonts are compiled in from app.config.yaml's `icons` and
      # `fonts` blocks: edit it, then `docker compose up -d --build`
      # (docs/self-hosting.md). Nothing about them goes in .env.
    image: openchat-web
    # A local image: never look for it on Docker Hub.
    pull_policy: build
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # The app reads its settings from the environment (.env.example).
    env_file:
      - path: .env
        required: false
    environment:
      # Inside compose the database is `postgres`, not localhost; this wins
      # over .env's DATABASE_URL, which is for `bun dev` on the host.
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-app}
      # Same for the optional services, when their profiles run.
      SANDBOX_RUNNER_URL: http://sandbox-runner:7070
      SEARXNG_URL: ${SEARXNG_URL:+http://searxng:8080}
      VOICE_STT_URL: ${VOICE_STT_URL:+http://whisper:8000/v1}
      VOICE_TTS_URL: ${VOICE_TTS_URL:+http://kokoro:8880/v1}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:${WEB_PORT:-3000}}
    ports:
      # Loopback only: put a TLS proxy in front to serve it to a network.
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      # Uploads (the local file store; the image links ./.data, where the
      # default storage.path is, into it) and the generated secrets.
      - web-data:/app/apps/web/data
    # No Docker socket, ever (D24): sandboxes go through sandbox-runner.

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      # Bound to localhost so the dev database is never exposed on the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional self-hosted web search: `docker compose --profile search up -d`,
  # then set SEARXNG_URL. Pinned to a release (bump deliberately); the
  # settings below turn on the JSON API the `web_search` tool calls.
  searxng:
    image: searxng/searxng:2026.9.25-12f8b6515
    profiles: [search]
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://localhost:${SEARXNG_PORT:-8080}/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-dev-only-change-me}
    configs:
      - source: searxng-settings
        target: /etc/searxng/settings.yml
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8080}:8080"

  # Docker sandboxes (PLAN.md D7, D24): `bun dev` starts them, or
  # `docker compose --profile sandbox up -d sandbox-runner`.
  # The runner is the only service that can reach Docker, and only through
  # this proxy, which allows just the API sections it uses. No other service
  # (`web` included) ever mounts the socket.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    profiles: [sandbox]
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      EXEC: 1
      IMAGES: 1
      INFO: 1
      NETWORKS: 1
      VOLUMES: 1
      # Write methods on the sections above (create, start, exec, remove).
      POST: 1
      EVENTS: 0
      VERSION: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-api]

  sandbox-runner:
    build:
      context: .
      dockerfile: apps/sandbox-runner/Dockerfile
      secrets: [ca, npmrc]
    profiles: [sandbox]
    restart: unless-stopped
    depends_on: [docker-socket-proxy]
    # A stable name, so the runner can join sandbox networks to reach previews
    # and sandboxes can find its egress proxy. Override it to run a second
    # checkout's runner beside this one.
    container_name: ${SANDBOX_RUNNER_CONTAINER:-sandbox-runner}
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      RUNNER_CONTAINER: ${SANDBOX_RUNNER_CONTAINER:-sandbox-runner}
      # Required: the API refuses every call without it. Share it with `web`.
      SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:-}
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-auto}
      # Egress isn't set here: `sandbox.egress` in app.config.yaml travels with
      # each sandbox, and allowlisted ones go through this runner's proxy.
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-node:24-bookworm-slim}
      # A Dot's computer (172): build it with `docker compose --profile sandbox-desktop-build build sandbox-desktop`.
      SANDBOX_DESKTOP_IMAGE: ${SANDBOX_DESKTOP_IMAGE:-sandbox-desktop:latest}
      SANDBOX_PREVIEW_URL: ${SANDBOX_PREVIEW_URL:-http://{id}-{port}.sandbox.localhost:7071}
    ports:
      - "127.0.0.1:${SANDBOX_RUNNER_PORT:-7070}:7070"
      # Previews: a separate origin from the app (D24).
      - "127.0.0.1:${SANDBOX_PREVIEW_PORT:-7071}:7071"
    networks: [docker-api, default]

  # The desktop image a Dot's computer runs (172). Never started by compose:
  # the runner starts one container per Dot from it.
  sandbox-desktop:
    build:
      context: apps/sandbox-runner/desktop
    image: sandbox-desktop:latest
    pull_policy: build
    profiles: [sandbox-desktop-build]

  # Artifact previews (PLAN.md D24): `docker compose --profile artifacts up -d`,
  # then set ARTIFACTS_ORIGIN. Artifacts render here, on their own origin and
  # never the app's; the page has no network and keeps no cookies or storage.
  artifacts:
    build:
      context: .
      dockerfile: apps/artifacts/Dockerfile
      secrets: [ca, npmrc]
    profiles: [artifacts]
    restart: unless-stopped
    environment:
      # The app origins allowed to embed it (comma-separated); unset allows
      # any localhost port, for development.
      ARTIFACTS_APP_ORIGINS: ${ARTIFACTS_APP_ORIGINS:-}
      # The app, as this container reaches it (125): published sites and the
      # sites' public origins (artifacts.kinds.site) come from its API.
      # Unset, published links don't load and sites load nothing from outside.
      ARTIFACTS_API_ORIGIN: ${ARTIFACTS_API_ORIGIN:-}
    ports:
      - "127.0.0.1:${ARTIFACTS_PORT:-3910}:3910"

  # Voice conversations (docs/voice.md): `docker compose --profile voice up -d`,
  # then set VOICE_STT_URL and VOICE_TTS_URL. Both speak the OpenAI audio API
  # and run on CPU, arm64 (Apple Silicon) included. Models download on first
  # use into the volumes, so the first request is slow.
  whisper:
    # Speaches: faster-whisper (and Parakeet via onnx-asr) behind
    # /v1/audio/transcriptions.
    image: ghcr.io/speaches-ai/speaches:0.8.3-cpu
    profiles: [voice]
    restart: unless-stopped
    environment:
      # Keep the model loaded between turns (the default unloads after 5 min).
      WHISPER__TTL: "-1"
      WHISPER__CPU_THREADS: ${VOICE_STT_THREADS:-4}
    # The model downloads once, on request (docs/voice.md):
    #   curl -X POST localhost:8000/v1/models/Systran/faster-whisper-base.en
    ports:
      - "127.0.0.1:${VOICE_STT_PORT:-8000}:8000"
    volumes:
      - voice-models:/home/ubuntu/.cache/huggingface/hub

  kokoro:
    # Kokoro-FastAPI: the 82M-parameter Kokoro voice behind /v1/audio/speech.
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.2.4
    profiles: [voice]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${VOICE_TTS_PORT:-8880}:8880"

networks:
  # Only the runner and the proxy are on it, and it has no route out.
  docker-api:
    internal: true

configs:
  searxng-settings:
    content: |
      use_default_settings: true
      search:
        formats: [html, json]

# Build secrets for a corporate network (docs/self-hosting.md): the text of
# a root CA that intercepts TLS, and of an .npmrc for a package mirror.
# Unset, the builds behave as without them. They come from variables, not
# files, because a build may read only files inside this directory.
secrets:
  ca:
    environment: BUILD_CA_PEM
  npmrc:
    environment: BUILD_NPMRC

volumes:
  postgres-data:
  voice-models:
  web-data:
