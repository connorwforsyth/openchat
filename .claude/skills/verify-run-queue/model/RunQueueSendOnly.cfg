\* Sending, queueing and finishing: three turns, each sent after any run's
\* last message or on a new branch. No Stop, no approvals. Every property
\* holds here, so a change that breaks the queue itself shows up as a new
\* failure even while the findings below stand.
SPECIFICATION CheckedSpec
CONSTANTS
  NRuns = 3
  NStops = 0
  NDecides = 0
  MaxPauses = 0
  AnyAnchor = TRUE
  StopTargets = {}
  defaultInitValue = defaultInitValue
